name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Generate Android platform files safely
        run: |
          mkdir -p temp_proj
          cd temp_proj
          flutter create . --platforms=android --project-name hatrik_academy
          cd ..
          cp -r temp_proj/android ./
          rm -rf temp_proj

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hatrik-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
